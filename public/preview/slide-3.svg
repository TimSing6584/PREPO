<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#101010"/>
  <ellipse cx="300" cy="200" rx="200" ry="140" fill="#8b5cf6" opacity="0.07"/>

  <!-- Starred banner -->
  <rect x="150" y="36" width="300" height="44" rx="12" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1"/>
  <polygon points="170,52 173,45 176,52 184,52 178,57 180,64 173,60 166,64 168,57 162,52" fill="#f59e0b"/>
  <text x="192" y="63" font-family="sans-serif" font-size="13" font-weight="600" fill="#f59e0b" fill-opacity="0.85">3 starred questions to review</text>

  <!-- My question card -->
  <rect x="150" y="96" width="300" height="136" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <!-- label -->
  <rect x="168" y="112" width="80" height="22" rx="8" fill="#6366f1" fill-opacity="0.25"/>
  <text x="208" y="127" font-family="sans-serif" font-size="10" font-weight="700" fill="#a5b4fc" text-anchor="middle">MY QUESTION</text>
  <!-- question text -->
  <text x="168" y="154" font-family="sans-serif" font-size="12" fill="white" fill-opacity="0.75">Explain the difference between</text>
  <text x="168" y="170" font-family="sans-serif" font-size="12" fill="white" fill-opacity="0.75">a process and a thread.</text>
  <!-- badges -->
  <rect x="168" y="188" width="36" height="20" rx="10" fill="#6366f1" fill-opacity="0.3"/>
  <text x="186" y="202" font-family="sans-serif" font-size="10" font-weight="600" fill="#a5b4fc" text-anchor="middle">OS</text>
  <rect x="212" y="188" width="118" height="20" rx="10" fill="#ffffff" fill-opacity="0.06"/>
  <text x="271" y="202" font-family="sans-serif" font-size="10" fill="white" fill-opacity="0.3" text-anchor="middle">Visible only to you</text>

  <!-- Second card -->
  <rect x="150" y="248" width="300" height="72" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="168" y="272" font-family="sans-serif" font-size="12" fill="white" fill-opacity="0.45">What is a deadlock?</text>
  <rect x="168" y="282" width="36" height="18" rx="9" fill="#6366f1" fill-opacity="0.2"/>
  <text x="186" y="295" font-family="sans-serif" font-size="10" fill="#a5b4fc" fill-opacity="0.7" text-anchor="middle">OS</text>

  <!-- Add new dashed -->
  <rect x="150" y="334" width="300" height="44" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="300" y="361" font-family="sans-serif" font-size="12" fill="white" fill-opacity="0.25" text-anchor="middle">+ Add your own question</text>
</svg>
