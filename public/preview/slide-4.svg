<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#101010"/>
  <ellipse cx="300" cy="200" rx="200" ry="140" fill="#d946ef" opacity="0.07"/>

  <!-- AI bubble -->
  <rect x="100" y="36" width="310" height="100" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <polygon points="100,96 84,108 100,104" fill="#ffffff" fill-opacity="0.07"/>
  <!-- AI avatar -->
  <circle cx="72" cy="114" r="14" fill="#d946ef" fill-opacity="0.25" stroke="#d946ef" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="72" y="119" font-family="sans-serif" font-size="13" fill="#e879f9" text-anchor="middle">✦</text>
  <!-- AI text -->
  <text x="120" y="62" font-family="sans-serif" font-size="12" fill="white" fill-opacity="0.65">Your answer is close — but you missed</text>
  <text x="120" y="79" font-family="sans-serif" font-size="12" fill="white" fill-opacity="0.65">that threads share the same memory</text>
  <text x="120" y="96" font-family="sans-serif" font-size="12" fill="white" fill-opacity="0.65">space while processes don't.</text>
  <!-- AI label -->
  <text x="120" y="118" font-family="sans-serif" font-size="10" font-weight="700" fill="#e879f9" fill-opacity="0.6">Prepo AI</text>

  <!-- User bubble -->
  <rect x="190" y="158" width="310" height="68" rx="18" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>
  <polygon points="500,196 516,206 500,202" fill="#6366f1" fill-opacity="0.2"/>
  <!-- user avatar -->
  <circle cx="528" cy="210" r="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
  <text x="528" y="215" font-family="sans-serif" font-size="11" fill="white" fill-opacity="0.4" text-anchor="middle">You</text>
  <!-- user text -->
  <text x="210" y="184" font-family="sans-serif" font-size="12" fill="white" fill-opacity="0.7">Can you give me a hint on</text>
  <text x="210" y="201" font-family="sans-serif" font-size="12" fill="white" fill-opacity="0.7">memory isolation?</text>

  <!-- Second AI bubble -->
  <rect x="100" y="250" width="310" height="84" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <polygon points="100,296 84,308 100,304" fill="#ffffff" fill-opacity="0.07"/>
  <text x="120" y="276" font-family="sans-serif" font-size="12" fill="white" fill-opacity="0.6">Sure! Think about what happens when</text>
  <text x="120" y="293" font-family="sans-serif" font-size="12" fill="white" fill-opacity="0.6">two processes crash — do they affect</text>
  <text x="120" y="310" font-family="sans-serif" font-size="12" fill="white" fill-opacity="0.6">each other?</text>

  <!-- Input bar -->
  <rect x="100" y="352" width="400" height="38" rx="19" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <text x="122" y="376" font-family="sans-serif" font-size="12" fill="white" fill-opacity="0.2">Ask a follow-up...</text>
  <circle cx="474" cy="371" r="13" fill="#d946ef" fill-opacity="0.35"/>
  <text x="474" y="376" font-family="sans-serif" font-size="13" fill="#e879f9" text-anchor="middle">✦</text>
</svg>
